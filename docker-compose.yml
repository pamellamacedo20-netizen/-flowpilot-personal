services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot-dev
    ports:
      - "5432:5432"
    volumes:
      - flowpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      NODE_ENV: development
      PERSONAL_MODE: "true"
      PERSONAL_EMAIL: admin@flowpilot.local
      PERSONAL_PASSWORD: FlowPilotPersonal123!
      PERSONAL_NAME: Administrador
      PERSONAL_WORKSPACE_NAME: Meu Instagram
      PORT: 4173
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://flowpilot:flowpilot-dev@postgres:5432/flowpilot
      PGSSL: disable
      APP_ENCRYPTION_KEY: development-only-encryption-key-change-me-now
      SEED_DEMO: "false"
      META_GRAPH_VERSION: v26.0
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  flowpilot_pg:
